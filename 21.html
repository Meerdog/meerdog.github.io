<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21 Knob: Interactive Simulator V9</title>
    <style>
        :root {
            --lane-L: #b5d0f5; --lane-C: #f0f0f0; --lane-R: #faeab0;
            --p1-color: #4361ee; --p2-color: #f72585;
            --wood: #8b5a2b; --bg-dark: #1e1e24;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: #fff;
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
        }

        .app-container {
            display: flex; flex-direction: column; 
            gap: 15px; width: 100%; max-width: 500px; margin: 0 auto;
        }

        /* --- DASHBOARDS --- */
        .header-row {
            display: flex; justify-content: space-between; width: 100%;
            align-items: center; background: #2b2b36; padding: 10px 15px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #444;
        }
        .player-card { flex: 1; text-align: center; }
        .player-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; text-transform: uppercase; }
        .score { font-size: 1.8rem; font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .stam-text { font-size: 1.2rem; font-weight: bold; color: #06d6a0; }
        .stam-text.low { color: #d62828; }

        /* --- PLAYING FIELD --- */
        .board-wrapper {
            background: #fff; padding: 15px; border-radius: 12px;
            border: 6px solid var(--wood); box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        /* --- SVG HEX GRID & TOKENS --- */
        .svg-container {
            position: relative; background: rgba(0,0,0,0.02);
        }
        
        .token {
            position: absolute; border-radius: 50%; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            top: 0; left: 0; 
        }
        .p1 { width: 30px; height: 30px; background: var(--p1-color); border: 2px solid white; margin: -15px 0 0 -15px; }
        .p2 { width: 30px; height: 30px; background: var(--p2-color); border: 2px solid white; margin: -15px 0 0 -15px; }
        .ball {
            width: 14px; height: 14px; background: radial-gradient(circle at 30% 30%, #ffd166, #ff9f1c);
            z-index: 15; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); 
            margin: -7px 0 0 -7px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* --- OVERLAYS (Dice & Popups) --- */
        .dice-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: white; color: black;
            border-radius: 12px; display: none; align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold; z-index: 50;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.6);
            border: 4px solid #333;
        }

        .action-popup {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: rgba(20, 20, 25, 0.95); color: white;
            border: 2px solid #ff9f1c; border-radius: 8px; padding: 15px;
            text-align: center; font-size: 1.1rem; z-index: 60; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); line-height: 1.4;
            backdrop-filter: blur(4px);
        }
        .action-popup b { color: #ff9f1c; font-size: 1.2rem; display: block; margin-bottom: 5px; text-transform: uppercase;}

        /* --- CONTROLS SECTION --- */
        .controls-wrapper {
            background: #2b2b36; padding: 15px; border-radius: 8px; border: 2px solid #444;
            display: flex; flex-direction: column; gap: 15px;
        }

        /* DOOR UI */
        .door-ui {
            width: 100%; height: 160px; background: #eab676; 
            border: 10px solid #5a3818; border-radius: 4px; display: flex; 
            flex-direction: column; gap: 6px; padding: 6px; position: relative; 
            cursor: pointer; box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .door-ui.disabled { pointer-events: none; opacity: 0.5; filter: grayscale(50%); }
        .door-panel {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #000; border-radius: 2px; border: 3px solid transparent;
            transition: all 0.2s; font-size: 0.9rem; letter-spacing: 0.5px; text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
        }
        .dp-top { background: #8fb8ed; }
        .dp-center { background: #f4a261; }
        .dp-bottom { background: #2a9d8f; }
        
        .door-panel.selected { border: 3px solid #fff; box-shadow: 0 0 15px #fff; transform: scale(1.02); z-index: 2; }
        .frame-selected { box-shadow: inset 0 0 0 8px #9b5de5; }
        
        .door-knob {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 60px; height: 60px; background: radial-gradient(circle, #ffe066, #d4af37);
            border-radius: 50%; border: 4px solid #8c7322; box-shadow: 3px 3px 10px rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem; 
            color: #000; font-weight: 900; text-align: center; line-height: 1.1; transition: all 0.2s;
        }
        .knob-selected { border-color: #fff; box-shadow: 0 0 25px #fff, inset 0 0 10px #fff; transform: translateY(-50%) scale(1.15); z-index: 10;}

        /* SELECTIONS & ODDS */
        .decision-panel {
            background: #1e1e24; padding: 15px; border-radius: 8px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 10px;
        }
        .odds-display {
            background: #111; padding: 12px; border-radius: 6px; border-left: 5px solid #ff9f1c;
            display: flex; justify-content: space-between; align-items: center;
        }
        .odds-text { font-size: 1rem; color: #ccc; line-height: 1.4; }
        .odds-number { font-size: 2rem; font-weight: bold; color: #ff9f1c; }
        
        select, button { width: 100%; padding: 14px; font-size: 1.05rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        select { background: #333; color: white; border: 1px solid #555; }
        button.primary { background: #ff9f1c; color: #000; text-transform: uppercase; box-shadow: 0 4px 0 #cc7a00; font-size: 1.2rem;}
        button.primary:active { transform: translateY(4px); box-shadow: none; }
        button:disabled { background: #555; color: #888; box-shadow: none; cursor: not-allowed; }

        .log { background: #111; height: 100px; overflow-y: auto; padding: 10px; font-size: 0.9rem; border-radius: 6px; color: #ccc; line-height: 1.4; border: 1px solid #333;}
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header-row">
        <div class="player-card">
            <h3 style="color: var(--p1-color)">MINTZY</h3>
            <div class="score" id="p1-score">0</div>
            <div>Stamina: <span class="stam-text" id="p1-stam">10</span></div>
        </div>
        <div style="font-size: 1.2rem; font-weight: bold; color: #777;">VS</div>
        <div class="player-card">
            <h3 style="color: var(--p2-color)">TANGO</h3>
            <div class="score" id="p2-score">0</div>
            <div>Stamina: <span class="stam-text" id="p2-stam">10</span></div>
        </div>
    </div>

    <div class="board-wrapper">
        <div style="font-weight: bold; color: #8b5a2b; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px;">The Foyer Corridor</div>
        <div class="svg-container" id="board-container">
            <div id="dice-on-board" class="dice-overlay">?</div>
            <div id="action-popup" class="action-popup"></div>

            <div id="t-p1" class="token p1">🐱</div>
            <div id="t-p2" class="token p2">😼</div>
            <div id="t-ball" class="token ball"></div>
        </div>
    </div>

    <div class="controls-wrapper" id="controls-ui">
        
        <div class="door-ui" id="door-ui" onclick="selectFrame(event)">
            <div class="door-panel dp-top" id="dp-Top" onclick="setTarget('Top', event)">TOP PANEL (TN 3+)</div>
            <div class="door-panel dp-center selected" id="dp-Center" onclick="setTarget('Center', event)">CENTER PANEL (TN 2+)</div>
            <div class="door-panel dp-bottom" id="dp-Bottom" onclick="setTarget('Bottom', event)">BOTTOM PANEL (TN 4+)</div>
            <div class="door-knob" id="dp-Knob" onclick="setTarget('Knob', event)">THE<br>KNOB<br>(TN 6)</div>
            <div style="position: absolute; bottom: -28px; width: 100%; text-align: center; color: #aaa; font-size: 0.8rem; pointer-events: none;">Click wood edges for FRAME (TN 5+)</div>
        </div>

        <div class="decision-panel">
            <select id="sel-power" onchange="updateOdds()">
                <option value="1">Power 1 (Lob) [+1 Acc, Give 3 Moves]</option>
                <option value="2" selected>Power 2 (Drive) [0 Acc, Give 1 Move]</option>
                <option value="3">Power 3 (Bullet) [-2 Acc, Give 0 Moves]</option>
            </select>

            <div class="odds-display">
                <div class="odds-text">
                    <b><span id="ui-turn-name" style="color: var(--p1-color)">MINTZY</span>'s Shot</b><br>
                    Distance Cost: <span id="ui-cost" style="color: white; font-weight: bold;">0</span> Stamina<br>
                    Incoming Ball: <span id="ui-state" style="color: white;">Mid</span>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.8rem; color: #aaa; text-transform: uppercase;">Roll Required</div>
                    <div class="odds-number" id="ui-tn">2+</div>
                </div>
            </div>

            <button class="primary" onclick="playTurn()" id="btn-shoot">Run & Roll Dice</button>
        </div>

        <div class="log" id="log-box">The match begins! Mintzy has the serve.</div>

        <div style="margin-top: 5px; border-top: 1px solid #444; padding-top: 10px;">
            <select id="sel-p2-mode">
                <option value="human">Pass & Play (2 Player)</option>
                <option value="ai-balanced" selected>Play vs. AI Opponent</option>
            </select>
        </div>
    </div>
</div>

<script>
    // --- BOARD RENDER LOGIC ---
    const R = 20; 
    const W = Math.sqrt(3) * R; 
    const H = 2 * R; 
    const COLS = 7;
    const ROWS = 15; 

    let s = {
        p1: { id: 'Mintzy', class: 'p1', x: 3, y: 14, score: 0, stam: 10 },
        p2: { id: 'Tango', class: 'p2', x: 3, y: 12, score: 0, stam: 10 },
        ball: { x: 3, y: 14, state: 'Mid', freeMv: 3 },
        active: 1, isAnimating: false, target: 'Center'
    };

    function getHexCenter(c, r) {
        let cx = (c * W) + (r % 2 !== 0 ? W/2 : 0) + W/2;
        let cy = (r * H * 0.75) + H/2;
        return {x: cx, y: cy};
    }

    function getHexPoints(cx, cy) {
        let pts = [];
        for(let i=0; i<6; i++) {
            let angle = Math.PI / 180 * (60 * i - 30);
            pts.push(`${cx + R * Math.cos(angle)},${cy + R * Math.sin(angle)}`);
        }
        return pts.join(" ");
    }

    function buildSVGBoard() {
        const container = document.getElementById('board-container');
        let totalW = (COLS * W) + (W/2);
        let totalH = (ROWS * H * 0.75) + (H * 0.25);
        
        container.style.width = totalW + 'px';
        container.style.height = totalH + 'px';

        let svgHtml = `<svg width="${totalW}" height="${totalH}" xmlns="http://www.w3.org/2000/svg">`;
        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                let center = getHexCenter(c, r);
                let fill = c < 2 ? 'var(--lane-L)' : (c > 4 ? 'var(--lane-R)' : 'var(--lane-C)');
                svgHtml += `<polygon points="${getHexPoints(center.x, center.y)}" fill="${fill}" stroke="#888" stroke-width="1.5"/>`;
            }
        }
        
        let returnLineY = getHexCenter(0, 7).y;
        svgHtml += `<line x1="0" y1="${returnLineY}" x2="${totalW}" y2="${returnLineY}" stroke="#333" stroke-width="3" stroke-dasharray="8,4" />`;
        let serveLineY = getHexCenter(0, 13).y - H/2;
        svgHtml += `<line x1="0" y1="${serveLineY}" x2="${totalW}" y2="${serveLineY}" stroke="#fca311" stroke-width="5" />`;

        svgHtml += `</svg>`;
        container.insertAdjacentHTML('afterbegin', svgHtml);
    }

    function getPixelCoords(c, r, type = 'token') {
        if(type === 'door') return { x: 120, y: -40 }; 
        return getHexCenter(c, r); 
    }

    function updateTokens() {
        let p1 = getPixelCoords(s.p1.x, s.p1.y);
        document.getElementById('t-p1').style.transform = `translate(${p1.x}px, ${p1.y}px)`;
        let p2 = getPixelCoords(s.p2.x, s.p2.y);
        document.getElementById('t-p2').style.transform = `translate(${p2.x}px, ${p2.y}px)`;
        let b = getPixelCoords(s.ball.x, s.ball.y, 'ball');
        document.getElementById('t-ball').style.transform = `translate(${b.x}px, ${b.y}px)`;
    }

    // --- UI INTERACTION ---
    function selectFrame(e) { if (e.target.id === 'door-ui') setTarget('Frame', null); }
    
    function setTarget(targetZone, event) {
        if(event) event.stopPropagation();
        if(s.isAnimating || (s.active === 2 && document.getElementById('sel-p2-mode').value !== 'human')) return;
        
        s.target = targetZone;
        document.querySelectorAll('.door-panel').forEach(el => el.classList.remove('selected'));
        document.getElementById('door-ui').classList.remove('frame-selected');
        document.getElementById('dp-Knob').classList.remove('knob-selected');

        if(targetZone === 'Frame') document.getElementById('door-ui').classList.add('frame-selected');
        else if (targetZone === 'Knob') document.getElementById('dp-Knob').classList.add('knob-selected');
        else document.getElementById('dp-'+targetZone).classList.add('selected');

        updateOdds();
    }

    function updateOdds() {
        let p = s.active === 1 ? s.p1 : s.p2;
        let dist = Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y));
        let cost = Math.max(0, dist - s.ball.freeMv);
        
        document.getElementById('ui-cost').innerText = cost;
        document.getElementById('ui-cost').style.color = cost > p.stam ? '#d62828' : 'white';

        let tnBase = { 'Top':3, 'Center':2, 'Bottom':4, 'Frame':5, 'Knob':6 }[s.target];
        let power = parseInt(document.getElementById('sel-power').value);
        
        let mod = 0;
        if(cost >= 3) mod -= 1; 
        if(s.ball.x < 2 || s.ball.x > 4) mod -= 1; 
        if(s.ball.state === 'Low' && s.target !== 'Bottom') mod -= 2; 
        if(s.ball.state === 'High' && power === 3) mod += 0; 
        else if(power === 3) mod -= 2;
        else if(power === 1) mod += 1;
        
        let finalReq = tnBase - mod;
        let reqDisplay = finalReq > 6 ? (s.target==='Knob' ? '6!' : 'Imp.') : finalReq + '+';
        document.getElementById('ui-tn').innerText = reqDisplay;
        document.getElementById('ui-tn').style.color = finalReq > 6 ? '#d62828' : '#ff9f1c';

        document.getElementById('ui-turn-name').innerText = p.id;
        document.getElementById('ui-turn-name').style.color = `var(--${p.class}-color)`;
        document.getElementById('ui-state').innerText = s.ball.state;
    }

    function renderUI() {
        document.getElementById('p1-score').innerText = s.p1.score;
        document.getElementById('p2-score').innerText = s.p2.score;
        document.getElementById('p1-stam').innerText = s.p1.stam;
        document.getElementById('p1-stam').className = `stam-text ${s.p1.stam <= 2 ? 'low' : ''}`;
        document.getElementById('p2-stam').innerText = s.p2.stam;
        document.getElementById('p2-stam').className = `stam-text ${s.p2.stam <= 2 ? 'low' : ''}`;
        
        if(s.isAnimating) {
            document.getElementById('controls-ui').style.opacity = '0.5';
            document.getElementById('door-ui').classList.add('disabled');
        } else {
            document.getElementById('controls-ui').style.opacity = '1';
            document.getElementById('door-ui').classList.remove('disabled');
        }
        updateOdds();
    }

    function log(msg) {
        let box = document.getElementById('log-box');
        box.innerHTML += `<div style="margin-bottom:4px; color:#aaa;">${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function setButtons(disabled) { document.getElementById('btn-shoot').disabled = disabled; }

    function scatterBall(minY, maxY, lateralSpread = 1) {
        s.ball.y = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
        let spread = Math.floor(Math.random() * (lateralSpread * 2 + 1)) - lateralSpread;
        s.ball.x = Math.max(0, Math.min(6, s.ball.x + spread));
    }

    // --- ANIMATION & PHYSICS ENGINE ---
    async function showPopup(htmlContent) {
        const pop = document.getElementById('action-popup');
        pop.innerHTML = htmlContent;
        pop.style.display = 'block';
        pop.style.animation = 'fadeIn 0.3s ease-out forwards';
    }
    function hidePopup() { document.getElementById('action-popup').style.display = 'none'; }

    async function playTurn() {
        if(s.isAnimating) return;
        s.isAnimating = true; setButtons(true); renderUI();

        let p = s.active === 1 ? s.p1 : s.p2;
        let opp = s.active === 1 ? s.p2 : s.p1;
        let power = parseInt(document.getElementById('sel-power').value);
        
        let dist = Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y));
        let cost = Math.max(0, dist - s.ball.freeMv);
        
        if (cost > p.stam) {
            log(`<b style="color:#d62828">DIVE!</b> ${p.id} dives! Stamina = 0.`);
            p.stam = 0; power = 1; setTarget('Center', null);
        } else { p.stam -= cost; }

        p.x = s.ball.x; p.y = s.ball.y;
        updateTokens(); 
        await sleep(900); // Wait for player to arrive

        let tnBase = { 'Top':3, 'Center':2, 'Bottom':4, 'Frame':5, 'Knob':6 }[s.target];
        let mod = 0;
        if(cost >= 3) mod -= 1; 
        if(s.ball.x < 2 || s.ball.x > 4) mod -= 1; 
        if(s.ball.state === 'Low' && s.target !== 'Bottom') mod -= 2; 
        if(s.ball.state === 'High' && power === 3) mod += 0; 
        else if(power === 3) mod -= 2;
        else if(power === 1) mod += 1;

        // Roll Dice
        const dice = document.getElementById('dice-on-board');
        dice.style.display = 'flex';
        let roll = Math.floor(Math.random()*6)+1;
        for(let d of [50, 50, 50, 100, 100, 150, 200, 300]) {
            dice.innerText = Math.floor(Math.random()*6)+1;
            dice.style.transform = `translate(-50%, -50%) rotate(${(Math.random()*40)-20}deg) scale(${1 + Math.random()*0.2})`;
            await sleep(d);
        }
        dice.style.transform = `translate(-50%, -50%) rotate(0deg) scale(1.2)`;
        dice.innerText = roll;
        dice.style.color = (roll >= 5) ? '#2a9d8f' : (roll <= 2 ? '#d62828' : '#000');
        await sleep(1000); 
        dice.style.display = 'none'; dice.style.color = 'black'; 

        let total = roll + mod;
        log(`<span style="color:var(--${p.class}-color)">${p.id}</span> rolled ${roll} (Mod: ${mod}). Total: <b>${total}</b>.`);
        
        // Ball to Door (Fast)
        document.getElementById('t-ball').style.transition = "transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)";
        let bDoor = getPixelCoords(0, 0, 'door');
        document.getElementById('t-ball').style.transform = `translate(${bDoor.x}px, ${bDoor.y}px)`;
        await sleep(450); 

        // CALCULATE RESULT & SHOW POPUP
        let popupHtml = "";
        let lateralSpread = 1;

        if (total <= 0) {
            popupHtml = `<b>WHIFF!</b>Hit the drywall.<br>${opp.id} scores!`;
            handleScore(opp);
        } else if (total < tnBase && !(s.target === 'Knob' && roll === 6)) { 
            popupHtml = `<b>POPPED UP!</b>Missed the sweet spot.<br>Ball floats High (Rows 9-13) for an easy return.`;
            s.ball.state = 'High'; s.ball.freeMv = 3; scatterBall(9, 13, 1); s.active = s.active === 1 ? 2 : 1;
        } else {
            if(s.target === 'Knob' || (s.target === 'Center' && p.x >=2 && p.x <=4 && roll === 6)) {
                popupHtml = `<b>DING! THE KNOB!</b>A perfect strike.<br>3 Points!`;
                handleScore(p, 3);
            } else {
                lateralSpread = power === 3 ? 2 : 1; // More angular variety on hard hits
                if(s.target === 'Top') { 
                    popupHtml = `<b>TOP PANEL</b>High lob.<br>Lands deep (Rows 9-13) with normal scatter.`;
                    s.ball.state = 'High'; scatterBall(9, 13, lateralSpread); 
                }
                if(s.target === 'Center') { 
                    popupHtml = `<b>CENTER PANEL</b>Solid drive.<br>Lands Mid-Court (Rows 4-7) with ${power===3?'wide':'standard'} scatter.`;
                    s.ball.state = 'Mid'; scatterBall(4, 7, lateralSpread); 
                }
                if(s.target === 'Bottom') { 
                    popupHtml = `<b>BOTTOM PANEL</b>Nasty drop shot.<br>Lands short (Rows 1-3).`;
                    s.ball.state = 'Low'; scatterBall(1, 3, lateralSpread); 
                }
                if(s.target === 'Frame') { 
                    popupHtml = `<b>FRAME HIT!</b>Maximum Chaos!<br>Wild ricochet (Rows 3-8) with extreme lateral scatter!`;
                    s.ball.state = 'Mid'; scatterBall(3, 8, 2); 
                }
                s.ball.freeMv = power === 1 ? 3 : (power === 2 ? 1 : 0);
                s.active = s.active === 1 ? 2 : 1; 
            }
        }

        // Show Explanation Pop-up
        showPopup(popupHtml);
        await sleep(2500); // Read time
        hidePopup();

        // SLOW BALL RETURN
        document.getElementById('t-ball').style.transition = "transform 1.8s cubic-bezier(0.25, 1, 0.5, 1)";
        updateTokens(); 
        await sleep(1800); // Let ball float back down
        
        // Reset speed for next turn
        document.getElementById('t-ball').style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";
        
        s.isAnimating = false;
        renderUI();
        setButtons(false);
        if (s.active === 2) triggerAI();
    }

    function handleScore(winner, pts = 1) {
        if(winner.score === 21 && pts !== 3) log(`Must hit Knob to win!`);
        else winner.score = Math.min(21, winner.score + pts); 
        
        s.ball.x = 3; s.ball.y = 14; s.ball.state = 'Mid'; s.ball.freeMv = 3;
        s.p1.x = 3; s.p1.y = 14; s.p2.x = 4; s.p2.y = 14;
        s.active = winner === s.p1 ? 1 : 2; 
    }

    async function triggerAI() {
        let mode = document.getElementById('sel-p2-mode').value;
        if (mode === 'human' || s.active === 1) return;
        setButtons(true);
        await sleep(1000); 
        
        let cost = Math.max(0, Math.max(Math.abs(s.p2.x - s.ball.x), Math.abs(s.p2.y - s.ball.y)) - s.ball.freeMv);
        let target = 'Center', power = 2;
        if (s.p2.score >= 18) { target = 'Knob'; power = 1; }
        else if (cost > s.p2.stam) { target = 'Center'; power = 1; }
        else if (s.ball.state === 'High') { power = 3; target = Math.random() > 0.5 ? 'Bottom' : 'Frame'; }
        else { power = 2; target = Math.random() > 0.5 ? 'Center' : 'Bottom'; }

        document.getElementById('sel-power').value = power;
        setTarget(target, null);
        await sleep(800); 
        playTurn();
    }

    buildSVGBoard(); updateTokens(); renderUI();
</script>
</body>
</html>
