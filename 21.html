<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21 Knob: High-Intensity V15</title>
    <style>
        :root {
            --lane-L: #b5d0f5; --lane-C: #f0f0f0; --lane-R: #faeab0;
            --p1-color: #4361ee; --p2-color: #f72585;
            --wood: #8b5a2b; --bg-dark: #1e1e24;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark); color: #fff;
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
        }

        .app-container {
            display: flex; flex-direction: column; 
            gap: 15px; width: 100%; max-width: 500px; margin: 0 auto;
        }

        /* --- DASHBOARDS --- */
        .header-row {
            display: flex; justify-content: space-between; width: 100%;
            align-items: center; background: #2b2b36; padding: 10px 15px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #444;
        }
        .player-card { flex: 1; text-align: center; }
        .player-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; text-transform: uppercase; }
        .score { font-size: 1.8rem; font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .stam-text { font-size: 1.2rem; font-weight: bold; color: #06d6a0; }
        .stam-text.low { color: #f72585; }
        .stam-max { font-size: 0.9rem; color: #888; }
        .fatigue-text { color: #f72585; font-size: 0.7rem; font-weight: bold; display: none; }

        .btn-icon {
            background: #ff9f1c; color: #000; font-weight: bold; font-size: 1.2rem;
            width: 40px; height: 40px; border-radius: 50%; border: none;
            cursor: pointer; box-shadow: 0 4px 0 #cc7a00; transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- PLAYING FIELD --- */
        .board-wrapper {
            background: #fff; padding: 15px; border-radius: 12px;
            border: 6px solid var(--wood); box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        /* --- SVG GRID & TOKENS --- */
        .svg-container { position: relative; background: #fff; border-radius: 4px;}
        .token {
            position: absolute; border-radius: 50%; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            top: 0; left: 0; 
        }
        .p1 { width: 30px; height: 30px; background: var(--p1-color); border: 2px solid white; margin: -15px 0 0 -15px; }
        .p2 { width: 30px; height: 30px; background: var(--p2-color); border: 2px solid white; margin: -15px 0 0 -15px; }
        .ball {
            width: 14px; height: 14px; background: radial-gradient(circle at 30% 30%, #ffd166, #ff9f1c);
            z-index: 15; transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1); 
            margin: -7px 0 0 -7px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* --- OVERLAYS --- */
        .dice-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: white; color: black;
            border-radius: 12px; display: none; align-items: center; justify-content: center;
            font-size: 3.5rem; font-weight: bold; z-index: 50;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.6);
            border: 4px solid #333;
        }

        .action-popup {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: rgba(20, 20, 25, 0.95); color: white;
            border: 2px solid #ff9f1c; border-radius: 8px; padding: 15px;
            text-align: center; font-size: 1.1rem; z-index: 60; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); line-height: 1.4;
        }

        /* --- DOOR UI --- */
        .door-ui {
            width: 100%; height: 200px; background: #6e4125; border: 14px solid #3b2212; 
            border-radius: 6px; display: grid; grid-template-columns: 1fr 1.3fr 1fr; 
            grid-template-rows: 2fr 1fr; gap: 8px; padding: 10px; position: relative; cursor: pointer; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 8px 15px rgba(0,0,0,0.4); margin-bottom: 5px;
        }
        .door-ui.disabled { pointer-events: none; opacity: 0.6; }
        .door-panel {
            border: 2px solid #522f18; border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); transition: all 0.15s ease;
        }
        .dp-left { background: linear-gradient(135deg, #5c7b9e, #3a506b); } 
        .dp-center { background: linear-gradient(135deg, #a66a38, #7a461e); } 
        .dp-right { background: linear-gradient(135deg, #5c7b9e, #3a506b); } 
        .dp-bottom { background: linear-gradient(135deg, #447a6d, #254a41); grid-column: 1 / span 3; }
        .door-panel.selected { border: 3px solid #ff9f1c; box-shadow: 0 0 15px #ff9f1c; }
        
        .door-knob {
            position: absolute; right: 30%; top: 40%; transform: translate(50%, -50%);
            width: 60px; height: 60px; background: radial-gradient(circle at 35% 35%, #fff7cc, #d4af37, #8c7322);
            border-radius: 50%; border: 3px solid #544411; display: flex; align-items: center; justify-content: center; 
            font-size: 1rem; color: #222; font-weight: 900; z-index: 10;
        }
        .knob-selected { border-color: #fff; box-shadow: 0 0 25px #f72585; transform: translate(50%, -50%) scale(1.1); }

        /* --- CONTROLS --- */
        .controls-wrapper { background: #2b2b36; padding: 15px; border-radius: 8px; border: 2px solid #444; }
        .decision-panel { background: #1e1e24; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        .odds-display { background: #111; padding: 10px; border-radius: 6px; border-left: 5px solid #ff9f1c; display: flex; justify-content: space-between; align-items: center; }
        select, button { width: 100%; padding: 14px; font-size: 1.05rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        button.primary { background: #ff9f1c; color: #000; text-transform: uppercase; }
        .log { background: #111; height: 100px; overflow-y: auto; padding: 10px; font-size: 0.9rem; border-radius: 6px; color: #ccc; margin-top: 10px;}
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header-row">
        <div class="player-card">
            <h3 style="color: var(--p1-color)">MINTZY</h3>
            <div class="score" id="p1-score">0</div>
            <div>Stam: <span class="stam-text" id="p1-stam">10</span><span class="stam-max">/10</span></div>
            <div id="p1-fatigue" class="fatigue-text">FATIGUED (-1)</div>
        </div>
        <button class="btn-icon" onclick="toggleModal('rules-modal')">?</button>
        <div class="player-card">
            <h3 style="color: var(--p2-color)">TANGO</h3>
            <div class="score" id="p2-score">0</div>
            <div>Stam: <span class="stam-text" id="p2-stam">10</span><span class="stam-max">/10</span></div>
            <div id="p2-fatigue" class="fatigue-text">FATIGUED (-1)</div>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="svg-container" id="board-container">
            <div id="dice-on-board" class="dice-overlay">?</div>
            <div id="action-popup" class="action-popup"></div>
            <div id="t-p1" class="token p1">🐱</div>
            <div id="t-p2" class="token p2">😼</div>
            <div id="t-ball" class="token ball"></div>
        </div>
    </div>

    <div class="controls-wrapper" id="controls-ui">
        <div class="door-ui" id="door-ui" onclick="selectFrame(event)">
            <div class="door-panel dp-left" id="dp-Left" onclick="setTarget('Left', event)">LEFT</div>
            <div class="door-panel dp-center selected" id="dp-Center" onclick="setTarget('Center', event)">CENTER</div>
            <div class="door-panel dp-right" id="dp-Right" onclick="setTarget('Right', event)">RIGHT</div>
            <div class="door-panel dp-bottom" id="dp-Bottom" onclick="setTarget('Bottom', event)">DROP SHOT</div>
            <div class="door-knob" id="dp-Knob" onclick="setTarget('Knob', event)">KNOB</div>
        </div>

        <div class="decision-panel">
            <select id="sel-power" onchange="updateOdds()">
                <option value="1">Power 1 (Lob) [+1 Acc, Give 3 Moves]</option>
                <option value="2" selected>Power 2 (Drive) [0 Acc, Give 1 Move]</option>
                <option value="3">Power 3 (Bullet) [-2 Acc, Give 0 Moves]</option>
            </select>

            <div class="odds-display">
                <div style="color: #ccc; line-height: 1.4;">
                    <b><span id="ui-turn-name">MINTZY</span>'s Swing</b><br>
                    Run Cost: <span id="ui-cost" style="font-weight: bold;">0</span> Stamina
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.8rem; color: #aaa;">ROLL REQ.</div>
                    <div style="font-size: 2rem; font-weight: bold; color: #ff9f1c;" id="ui-tn">2+</div>
                </div>
            </div>

            <button class="primary" onclick="playTurn()" id="btn-shoot">Run & Shoot</button>
        </div>
        <div class="log" id="log-box">High Intensity Skirmish Loaded! 5-6 shot target.</div>
    </div>
</div>

<script>
    const R = 20, W = Math.sqrt(3)*R, H = 2*R, COLS = 7, ROWS = 15; 
    let s = {
        p1: { id: 'Mintzy', class: 'p1', x: 3, y: 14, score: 0, stam: 10, maxStam: 10 },
        p2: { id: 'Tango', class: 'p2', x: 3, y: 12, score: 0, stam: 10, maxStam: 10 },
        ball: { x: 3, y: 14, state: 'Mid', freeMv: 3 },
        active: 1, isAnimating: false, target: 'Center'
    };

    function getHexCenter(c, r) { return { x: (c*W) + (r%2!==0 ? W/2 : 0) + W/2, y: (r*H*0.75) + H/2 }; }
    function getHexPoints(cx, cy) {
        let pts = [];
        for(let i=0; i<6; i++) pts.push(`${cx + R * Math.cos(Math.PI/180 * (60*i-30))},${cy + R * Math.sin(Math.PI/180 * (60*i-30))}`);
        return pts.join(" ");
    }

    function buildSVGBoard() {
        const container = document.getElementById('board-container');
        let totalW = (COLS*W)+(W/2), totalH = (ROWS*H*0.75)+(H*0.25);
        container.style.width = totalW + 'px'; container.style.height = totalH + 'px';
        let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", totalW); svg.setAttribute("height", totalH);
        svg.style.position = "absolute"; svg.style.top = "0"; svg.style.left = "0"; svg.style.zIndex = "1";

        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                let center = getHexCenter(c, r);
                let fill = c < 2 ? '#b5d0f5' : (c > 4 ? '#faeab0' : '#f0f0f0');
                let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                poly.setAttribute("points", getHexPoints(center.x, center.y));
                poly.setAttribute("fill", fill); poly.setAttribute("stroke", "#bbb"); svg.appendChild(poly);
            }
        }
        container.insertBefore(svg, container.firstChild);
    }

    function updateTokens() {
        let p1 = getHexCenter(s.p1.x, s.p1.y), p2 = getHexCenter(s.p2.x, s.p2.y), b = getHexCenter(s.ball.x, s.ball.y);
        document.getElementById('t-p1').style.transform = `translate(${p1.x}px, ${p1.y}px)`;
        document.getElementById('t-p2').style.transform = `translate(${p2.x}px, ${p2.y}px)`;
        document.getElementById('t-ball').style.transform = `translate(${b.x}px, ${b.y}px)`;
    }

    function setTarget(targetZone, event) {
        if(event) event.stopPropagation();
        if(s.isAnimating) return;
        s.target = targetZone;
        document.querySelectorAll('.door-panel').forEach(el => el.classList.remove('selected'));
        document.getElementById('dp-Knob').classList.remove('knob-selected');
        if (targetZone === 'Knob') document.getElementById('dp-Knob').classList.add('knob-selected');
        else document.getElementById('dp-'+targetZone).classList.add('selected');
        updateOdds();
    }

    function updateOdds() {
        let p = s.active === 1 ? s.p1 : s.p2;
        let dist = Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y));
        let cost = Math.max(0, dist - s.ball.freeMv);
        document.getElementById('ui-cost').innerText = cost;
        
        let tnBase = { 'Left':3, 'Center':2, 'Right':3, 'Bottom':4, 'Frame':5, 'Knob':6 }[s.target];
        let power = parseInt(document.getElementById('sel-power').value);
        let mod = 0;
        if(cost >= 2) mod -= 1; // FASTER EXHAUSTION
        if(p.stam <= 5) mod -= 1; // FATIGUE PENALTY
        if(s.ball.state === 'High' && power === 3) mod += 0;
        else if(power === 3) mod -= 2;
        else if(power === 1) mod += 1;
        
        document.getElementById('ui-tn').innerText = (tnBase - mod) + '+';
        document.getElementById('ui-turn-name').innerText = p.id.toUpperCase();
    }

    function renderUI() {
        document.getElementById('p1-score').innerText = s.p1.score; document.getElementById('p2-score').innerText = s.p2.score;
        document.getElementById('p1-stam').innerText = s.p1.stam; document.getElementById('p2-stam').innerText = s.p2.stam;
        document.getElementById('p1-stam').className = `stam-text ${s.p1.stam <= 4 ? 'low' : ''}`;
        document.getElementById('p2-stam').className = `stam-text ${s.p2.stam <= 4 ? 'low' : ''}`;
        document.getElementById('p1-fatigue').style.display = s.p1.stam <= 5 ? 'block' : 'none';
        document.getElementById('p2-fatigue').style.display = s.p2.stam <= 5 ? 'block' : 'none';
        updateOdds();
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function playTurn() {
        if(s.isAnimating) return;
        s.isAnimating = true; renderUI();

        let p = s.active === 1 ? s.p1 : s.p2, opp = s.active === 1 ? s.p2 : s.p1;
        let power = parseInt(document.getElementById('sel-power').value);
        let dist = Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y)), cost = Math.max(0, dist - s.ball.freeMv);
        
        if (cost > p.stam) { p.stam = 0; power = 1; s.target = 'Center'; } 
        else { p.stam -= cost; }

        p.x = s.ball.x; p.y = s.ball.y; updateTokens(); await sleep(700); 

        // Dice Roll Animation
        const dice = document.getElementById('dice-on-board'); dice.style.display = 'flex';
        let roll = Math.floor(Math.random()*6)+1;
        for(let d of [50,100,200]) { dice.innerText = Math.floor(Math.random()*6)+1; await sleep(d); }
        dice.innerText = roll; await sleep(600); dice.style.display = 'none';

        let mod = 0;
        if(cost >= 2) mod -= 1;
        if(p.stam <= 5) mod -= 1;
        if(s.ball.state === 'High' && power === 3) mod += 0;
        else if(power === 3) mod -= 2;
        else if(power === 1) mod += 1;
        
        let total = roll + mod;
        let tn = { 'Left':3, 'Center':2, 'Right':3, 'Bottom':4, 'Frame':5, 'Knob':6 }[s.target];

        // Hit Result
        if (total <= 0) { handleScore(opp); }
        else if (total < tn) { s.ball.state = 'High'; s.ball.freeMv = 3; scatter(8, 12, 3); s.active = s.active === 1 ? 2 : 1; }
        else {
            if (s.target === 'Knob') { handleScore(p, 3); }
            else {
                s.ball.state = s.target === 'Bottom' ? 'Low' : 'Mid';
                s.ball.freeMv = power === 1 ? 3 : (power === 2 ? 1 : 0); // NERFED POWER 2
                scatter(s.target === 'Bottom' ? 1 : 4, s.target === 'Bottom' ? 3 : 7, s.target === 'Left' ? 5 : (s.target === 'Right' ? 1 : 3));
                s.active = s.active === 1 ? 2 : 1;
            }
        }

        updateTokens(); s.isAnimating = false; renderUI();
        if (s.active === 2) triggerAI();
    }

    function scatter(minY, maxY, tgtX) {
        s.ball.y = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
        s.ball.x = Math.max(0, Math.min(6, tgtX + (Math.floor(Math.random() * 3) - 1)));
    }

    function handleScore(winner, pts = 1) {
        winner.score = Math.min(21, winner.score + pts);
        s.p1.stam = s.p1.maxStam; s.p2.stam = s.p2.maxStam;
        s.ball.x = 3; s.ball.y = 14; s.active = winner === s.p1 ? 1 : 2;
    }

    async function triggerAI() {
        await sleep(800); setTarget(Math.random() > 0.7 ? 'Bottom' : 'Left', null); playTurn();
    }

    buildSVGBoard(); updateTokens(); renderUI();
</script>
</body>
</html>
