<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21 Knob: Skirmish V20</title>
    <style>
        :root {
            --p1-color: #4361ee; --p2-color: #f72585;
            --wood-dark: #3b2212; --foyer-bg: #e2e2e2;
            --sidebar-w: 180px;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e24; color: #fff; margin: 0; padding: 0; height: 100vh; display: flex; overflow: hidden; }

        /* --- LEFT SIDE: THE FOYER SKIRMISH --- */
        .game-viewport { flex-grow: 1; display: flex; flex-direction: column; height: 100%; border-right: 2px solid #444; padding: 10px; align-items: center; justify-content: flex-start; }
        
        /* The Realistic Door Standee */
        .door-target {
            width: 190px; height: 160px; background-color: var(--wood-dark); border-radius: 8px; position: relative;
            margin-bottom: 20px; border: 6px solid #1a110a; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.8);
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .door-target::after { content: ""; position: absolute; left: 10%; top: 5%; width: 5px; height: 90%; background: #2b180c; border-radius: 2px; }
        .door-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
            padding: 5px; opacity: 0.9;
        }
        .door-cell { display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; cursor: pointer; color: transparent; border-radius: 2px; transition: all 0.1s; }
        .door-cell.selected { background-color: rgba(255, 159, 28, 0.4); border: 2px solid #ff9f1c; box-shadow: 0 0 10px #ff9f1c; z-index: 5; color: white; }
        .door-cell:not(.selected):hover { background-color: rgba(255,255,255,0.1); }

        /* knob on LEFT MIDDLE */
        .knob-physical {
            position: absolute; left: 10%; top: 50%; transform: translate(-50%, -50%);
            width: 48px; height: 48px; background: radial-gradient(circle, #ffe066, #d4af37, #8c7322);
            border-radius: 50%; border: 3px solid #333; z-index: 10; display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase;
        }
        .knob-physical.selected { border-color: #fff; box-shadow: 0 0 20px #f72585; transform: translate(-50%, -50%) scale(1.05); }

        /* Pinned Foyer Board */
        .board-pinned {
            flex-grow: 1; background-color: var(--foyer-bg); border-radius: 8px; border: 6px solid var(--wood-dark);
            overflow: auto; max-height: 70vh; display: flex; justify-content: center; position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.4);
        }
        .svg-court { position: relative; }
        .token { position: absolute; border-radius: 50%; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.5s ease-out; }
        .p1 { width: 44px; height: 44px; background: var(--p1-color); border: 3px solid white; margin: -22px 0 0 -22px; }
        .p2 { width: 44px; height: 44px; background: var(--p2-color); border: 3px solid white; margin: -22px 0 0 -22px; }
        .ball { width: 14px; height: 14px; background: radial-gradient(circle at 30% 30%, #ffd166, #ff9f1c); z-index: 25; margin: -7px 0 0 -7px; transition: transform 0.7s cubic-bezier(0.1, 0.7, 0.1, 1); }

        /* --- RIGHT SIDE: COMMAND SIDEBAR --- */
        .sidebar { width: var(--sidebar-w); height: 100%; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #1a1a21; border-left: 1px solid #333; }
        .command-header { text-align: center; border-bottom: 2px solid #ff9f1c; padding-bottom: 5px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        
        .dashboard { display: flex; flex-direction: column; gap: 8px; }
        .dice-box { background: #fff; color: #000; height: 70px; width: 70px; border-radius: 8px; align-self: center; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid #ff9f1c; }
        .dice-val { font-size: 2.2rem; font-weight: 900; line-height: 1; }
        .dice-label { font-size: 0.6rem; text-transform: uppercase; font-weight: bold; }
        
        .cat-stats { background: #2b2b36; padding: 10px; border-radius: 6px; font-size: 0.85rem; }
        .log-display { flex-grow: 1; background: #000; padding: 8px; font-family: monospace; font-size: 0.75rem; border-radius: 4px; overflow-y: auto; color: #06d6a0; border: 1px solid #333; }
        
        .controls-pinned { display: flex; flex-direction: column; gap: 8px; }
        button { padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-shoot { background: #ff9f1c; color: #000; font-size: 1rem; box-shadow: 0 4px 0 #cc7a00;}
        .btn-shoot:active { transform: translateY(2px); box-shadow: none; }
        .btn-sim { background: #444; color: #fff; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="game-viewport">
        <div class="door-target">
            <div class="door-grid" id="door-ui">
                <div class="door-cell" onclick="setT('TL',5)">Top-L (TN 5)</div><div class="door-cell" onclick="setT('TM',4)">Top-M (TN 4)</div><div class="door-cell" onclick="setT('TR',5)">Top-R (TN 5)</div>
                <div class="door-cell" onclick="setT('ML',4)">Mid-L (TN 4)</div><div class="door-cell selected" onclick="setT('MM',2)">CTR (TN 2)</div><div class="door-cell" onclick="setT('MR',4)">Mid-R (TN 4)</div>
                <div class="door-cell" onclick="setT('BL',5)">Bot-L (TN 5)</div><div class="door-cell" onclick="setT('BM',4)">Bot-M (TN 4)</div><div class="door-cell" onclick="setT('BR',5)">Bot-R (TN 5)</div>
                <div class="knob-physical" id="kb" onclick="setT('KNOB',6)">GLORY</div>
            </div>
        </div>

        <div class="board-pinned">
            <div class="svg-court" id="board-container">
                <div id="t-p1" class="token p1">🐱</div>
                <div id="t-p2" class="token p2">😼</div>
                <div id="t-ball" class="token ball"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="command-header">Workstation</div>
        <div class="dice-box">
            <div class="dice-label">Dice Roll</div>
            <div class="dice-val" id="dv">?</div>
        </div>

        <div class="dashboard">
            <div class="cat-stats">
                <b style="color:var(--p1-color)">MINTZY</b><br>
                Score: <span id="s1">0</span> | Stam: <span id="st1">10</span>
            </div>
            <div class="cat-stats">
                <b style="color:var(--p2-color)">TANGO</b><br>
                Score: <span id="s2">0</span> | Stam: <span id="st2">10</span>
            </div>
        </div>

        <div class="controls-pinned">
            <button class="btn-shoot" onclick="playTurn()" id="sb">EXECUTE</button>
            <button class="btn-sim" onclick="toggleSim()" id="sm">AUTO-SIM</button>
        </div>

        <div class="log-display" id="log">> Serve Ready...</div>
    </div>

<script>
    const R = 18, W = Math.sqrt(3)*R, H = 2*R, COLS = 7, ROWS = 15;
    let s = {
        p1: { id: 'Mintzy', x: 3, y: 14, score: 0, stam: 10 },
        p2: { id: 'Tango', x: 4, y: 14, score: 0, stam: 10 },
        ball: { x: 3, y: 14, free: 3 },
        active: 1, target: 'MM', targetTN: 2, isSim: false, isAnim: false
    };

    function buildBoard() {
        const container = document.getElementById('board-container');
        let totalW = (COLS*W)+(W/2), totalH = (ROWS*H*0.75)+(H*0.25);
        container.style.width = totalW + 'px'; container.style.height = totalH + 'px';
        let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", totalW); svg.setAttribute("height", totalH);
        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                let cx = (c*W) + (r%2!==0 ? W/2 : 0) + W/2, cy = (r*H*0.75) + H/2;
                // Simplified Foyer Court Lines
                let fill = c < 2 ? '#dcdcdc' : (c > 4 ? '#dcdcdc' : '#f0f0f0');
                if(r < 3) fill = '#ffdede'; // Skirmish Zone

                let pts = []; for(let i=0; i<6; i++) pts.push(`${cx + R * Math.cos(Math.PI/180 * (60*i-30))},${cy + R * Math.sin(Math.PI/180 * (60*i-30))}`);
                let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                poly.setAttribute("points", pts.join(" ")); poly.setAttribute("fill", fill); poly.setAttribute("stroke", "#bbb");
                svg.appendChild(poly);
            }
        }
        container.insertBefore(svg, container.firstChild);
    }

    function setT(code, tn) {
        s.target = code; s.targetTN = tn;
        document.querySelectorAll('.door-cell, .knob-physical').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function updateView() {
        let p1c = { x: (s.p1.x*W) + (s.p1.y%2!==0 ? W/2 : 0) + W/2, y: (s.p1.y*H*0.75) + H/2 };
        let p2c = { x: (s.p2.x*W) + (s.p2.y%2!==0 ? W/2 : 0) + W/2, y: (s.p2.y*H*0.75) + H/2 };
        let bc = { x: (s.ball.x*W) + (s.ball.y%2!==0 ? W/2 : 0) + W/2, y: (s.ball.y*H*0.75) + H/2 };
        document.getElementById('t-p1').style.transform = `translate(${p1c.x}px, ${p1c.y}px)`;
        document.getElementById('t-p2').style.transform = `translate(${p2c.x}px, ${p2c.y}px)`;
        document.getElementById('t-ball').style.transform = `translate(${bc.x}px, ${bc.y}px)`;
        document.getElementById('s1').innerText = s.p1.score; document.getElementById('s2').innerText = s.p2.score;
        document.getElementById('st1').innerText = s.p1.stam; document.getElementById('st2').innerText = s.p2.stam;
    }

    async function playTurn() {
        if(s.isAnim) return; s.isAnim = true;
        let p = s.active === 1 ? s.p1 : s.p2, opp = s.active === 1 ? s.p2 : s.p1;
        let cost = Math.max(0, Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y)) - s.ball.free);
        p.stam = Math.max(0, p.stam - cost); p.x = s.ball.x; p.y = s.ball.y;
        updateView(); await new Promise(r => setTimeout(r, 400));

        let roll = Math.floor(Math.random()*6)+1, mod = (p.stam <= 3 ? -1 : 0), total = roll + mod;
        document.getElementById('dv').innerText = roll;
        const l = document.getElementById('log');

        if (total <= 0) { l.innerHTML = `> Whiff! Pt for ${opp.id}`; hScore(opp); }
        else if (s.target === 'KNOB' && roll === 6) { l.innerHTML = `> DING! KNOB HIT!`; hScore(p, 3); }
        else if (total >= s.targetTN) {
            let sx = (s.target.includes('L') ? 5 : (s.target.includes('R') ? 1 : 3));
            let sy = (s.target.includes('B') ? 2 : (s.target.includes('T') ? 12 : 6));
            if (Math.max(Math.abs(opp.x-sx), Math.abs(opp.y-sy)) > opp.stam+1) { l.innerHTML = `> Winner! Pt for ${p.id}`; hScore(p); }
            else { s.ball.x = sx; s.ball.y = sy; s.ball.free = 1; s.active = s.active === 1 ? 2 : 1; l.innerHTML = `> ${p.id} returns.`; }
        } else { l.innerHTML = `> Pop-up.`; s.ball.y = 10; s.active = s.active === 1 ? 2 : 1; }
        
        updateView(); s.isAnim = false; if(s.isSim) setTimeout(playTurn, 1000);
    }

    function hScore(w, pts=1) { w.score += pts; s.p1.stam = 10; s.p2.stam = 10; s.p1.x = 3; s.p1.y = 14; s.p2.x = 4; s.p2.y = 14; s.ball.x = 3; s.ball.y = 14; s.active = (w === s.p1 ? 1 : 2); document.getElementById('dv').innerText = '?'; }
    function toggleSim() { s.isSim = !s.isSim; document.getElementById('sm').innerText = s.isSim ? 'STOP' : 'AUTO-SIM'; if(s.isSim) playTurn(); }
    buildBoard(); updateView();
</script>
</body>
</html>
