<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21 Knob: AI Playtest Simulator</title>
    <style>
        :root {
            --lane-L: #8fb8ed;
            --lane-C: #e2e2e2;
            --lane-R: #f3db74;
            --p1-color: #2a6fdb;
            --p2-color: #d62828;
            --wood: #8b5a2b;
            --bg-dark: #1e1e24;
            --hex-w: 40px;
            --hex-h: 34.5px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        @media(min-width: 768px) {
            .app-container { flex-direction: row; align-items: flex-start; justify-content: center; }
        }

        .dashboards {
            display: flex; justify-content: space-between; gap: 10px; width: 100%;
            background: #2b2b36; padding: 10px; border-radius: 8px;
        }
        .player-card { flex: 1; text-align: center; }
        .player-card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .score { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .stamina-bar { display: flex; justify-content: center; gap: 2px; }
        .pip { width: 10px; height: 12px; border-radius: 2px; }
        .pip.filled { background: #06d6a0; }
        .pip.empty { background: #444; }

        .board-wrapper {
            background: #fff; padding: 10px; border-radius: 12px;
            border: 6px solid var(--wood);
            display: flex; flex-direction: column; align-items: center;
            margin: 0 auto;
        }
        .door-target {
            width: 100%; max-width: 310px; height: 35px;
            background: linear-gradient(to bottom, #a06b3c, var(--wood));
            color: white; text-align: center; line-height: 35px;
            font-weight: 800; border-radius: 4px; margin-bottom: 10px;
        }

        .hex-grid {
            position: relative; width: 315px; height: 530px;
            background: rgba(0,0,0,0.05); border-radius: 8px;
        }
        .hex {
            position: absolute; width: var(--hex-w); height: 46px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; color: rgba(0,0,0,0.2); transition: background 0.2s;
        }
        .hex.lane-L { background-color: var(--lane-L); }
        .hex.lane-C { background-color: var(--lane-C); }
        .hex.lane-R { background-color: var(--lane-R); }

        .token {
            position: absolute; border-radius: 50%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .p1 { width: 26px; height: 26px; background: var(--p1-color); border: 2px solid white; }
        .p2 { width: 26px; height: 26px; background: var(--p2-color); border: 2px solid white; }
        .ball {
            width: 16px; height: 16px; background: radial-gradient(circle at 30% 30%, #ffd166, #ff9f1c);
            z-index: 15; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .controls {
            background: #2b2b36; padding: 15px; border-radius: 8px;
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }
        .ai-panel { background: #3d1c1c; padding: 10px; border-radius: 6px; border-left: 4px solid var(--p2-color); }
        .info-panel { background: #1e1e24; padding: 10px; border-radius: 6px; border-left: 4px solid #ff9f1c; }
        
        select, button {
            width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px;
            border: none; outline: none; font-family: inherit;
        }
        button.primary { background: #ff9f1c; color: #000; font-weight: 800; text-transform: uppercase; }
        button.primary:active { transform: translateY(2px); }
        button.primary:disabled { background: #555; color: #888; cursor: not-allowed; }
        button.secondary { background: #555; color: white; margin-top: -5px; }

        .log {
            background: #111; height: 120px; overflow-y: auto; padding: 10px;
            font-size: 0.85rem; border-radius: 6px; color: #aaa; line-height: 1.4;
        }
        .log b { color: #ff9f1c; }
        .log .p1-text { color: var(--p1-color); font-weight: bold; }
        .log .p2-text { color: var(--p2-color); font-weight: bold; }
        
        #ai-status { color: #06d6a0; font-weight: bold; font-size: 0.9rem; text-align: center; height: 20px;}
    </style>
</head>
<body>

<div class="app-container">
    
    <div style="display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; max-width: 350px;">
        <div class="dashboards">
            <div class="player-card">
                <h3 style="color: var(--p1-color)">PLAYER 1</h3>
                <div class="score" id="p1-score">0</div>
                <div class="stamina-bar" id="p1-stam"></div>
            </div>
            <div style="width: 2px; background: #444;"></div>
            <div class="player-card">
                <h3 style="color: var(--p2-color)">PLAYER 2</h3>
                <div class="score" id="p2-score">0</div>
                <div class="stamina-bar" id="p2-stam"></div>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="door-target">3D DOOR STANDEE</div>
            <div class="hex-grid" id="grid">
                <div id="t-p1" class="token p1">1</div>
                <div id="t-p2" class="token p2">2</div>
                <div id="t-ball" class="token ball"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <h2 style="margin: 0; text-align: center;" id="turn-banner">P1'S TURN</h2>
        <div id="ai-status"></div>

        <div class="ai-panel">
            <label style="font-size: 0.85rem; color: #aaa;">Player 2 Controls:</label>
            <select id="sel-p2-mode">
                <option value="human">Human (Pass & Play)</option>
                <option value="ai-safe">AI: Conservative</option>
                <option value="ai-balanced" selected>AI: Balanced</option>
                <option value="ai-aggro">AI: Aggressive</option>
            </select>
        </div>
        
        <div class="info-panel">
            <b>Ball State:</b> <span id="ui-state">Mid</span><br>
            <b>Cost to Reach:</b> <span id="ui-cost">0</span> Stamina
        </div>

        <div>
            <select id="sel-target">
                <option value="Top">Top Panel (TN 3) - Lob</option>
                <option value="Center" selected>Center Panel (TN 2) - Safe</option>
                <option value="Bottom">Bottom Panel (TN 4) - Drop</option>
                <option value="Frame">Door Frame (TN 5) - Chaos</option>
                <option value="Knob">The Knob (TN 6) - Glory!</option>
            </select>
        </div>

        <div>
            <select id="sel-power">
                <option value="1">Power 1 (+1 Acc, Opp Gets 3 Moves)</option>
                <option value="2" selected>Power 2 (0 Acc, Opp Gets 1 Move)</option>
                <option value="3">Power 3 (-2 Acc, Opp Gets 0 Moves)</option>
            </select>
        </div>

        <button class="primary" onclick="playTurn()" id="btn-shoot">Run & Shoot</button>
        <button class="secondary" onclick="catchBreath()" id="btn-breath">Catch Breath (+3 Stamina)</button>

        <div class="log" id="log-box">Welcome to the Foyer.<br>Player 1, you have the serve!</div>
    </div>

</div>

<script>
    const COLS = 7, ROWS = 15, HEX_W = 42, HEX_H = 34.5;

    let s = {
        p1: { id: 'P1', class: 'p1-text', x: 3, y: 14, score: 0, stam: 10 },
        p2: { id: 'P2', class: 'p2-text', x: 3, y: 12, score: 0, stam: 10 },
        ball: { x: 3, y: 14, state: 'Mid', freeMv: 3 },
        active: 1, isAnimating: false
    };

    function buildGrid() {
        const grid = document.getElementById('grid');
        for(let y=0; y<ROWS; y++) {
            for(let x=0; x<COLS; x++) {
                let hex = document.createElement('div');
                hex.className = 'hex ' + (x < 2 ? 'lane-L' : (x > 4 ? 'lane-R' : 'lane-C'));
                hex.style.left = (x * HEX_W + (y % 2 !== 0 ? HEX_W / 2 : 0)) + 'px';
                hex.style.top = (y * HEX_H) + 'px';
                grid.appendChild(hex);
            }
        }
    }

    function getPixelCoords(x, y, isBall = false) {
        let px = x * HEX_W + (y % 2 !== 0 ? HEX_W / 2 : 0);
        let py = y * HEX_H;
        return { x: px + (isBall ? 12 : 7), y: py + (isBall ? 15 : 10) };
    }

    function updateTokens() {
        let p1 = getPixelCoords(s.p1.x, s.p1.y);
        document.getElementById('t-p1').style.transform = `translate(${p1.x}px, ${p1.y}px)`;
        let p2 = getPixelCoords(s.p2.x, s.p2.y);
        document.getElementById('t-p2').style.transform = `translate(${p2.x}px, ${p2.y}px)`;
        let b = getPixelCoords(s.ball.x, s.ball.y, true);
        document.getElementById('t-ball').style.transform = `translate(${b.x}px, ${b.y}px)`;
    }

    function renderUI() {
        document.getElementById('p1-score').innerText = s.p1.score;
        document.getElementById('p2-score').innerText = s.p2.score;
        
        const drawStam = (id, stam) => {
            document.getElementById(id+'-stam').innerHTML = Array.from({length:10}, (_,i) => 
                `<div class="pip ${i < stam ? 'filled' : 'empty'}"></div>`).join('');
        };
        drawStam('p1', s.p1.stam); drawStam('p2', s.p2.stam);

        let activeP = s.active === 1 ? s.p1 : s.p2;
        let banner = document.getElementById('turn-banner');
        banner.innerText = `${activeP.id}'S TURN`;
        banner.style.color = s.active === 1 ? 'var(--p1-color)' : 'var(--p2-color)';

        document.getElementById('ui-state').innerText = s.ball.state;
        let dist = Math.max(Math.abs(activeP.x - s.ball.x), Math.abs(activeP.y - s.ball.y));
        document.getElementById('ui-cost').innerText = Math.max(0, dist - s.ball.freeMv);
    }

    function log(msg) {
        let box = document.getElementById('log-box');
        box.innerHTML += `<div>${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function setButtons(disabled) {
        document.getElementById('btn-shoot').disabled = disabled;
        document.getElementById('btn-breath').disabled = disabled;
    }

    // --- AI LOGIC ---
    async function triggerAI() {
        let mode = document.getElementById('sel-p2-mode').value;
        if (mode === 'human' || s.active === 1) return;

        setButtons(true);
        document.getElementById('ai-status').innerText = "🤖 AI is planning its shot...";
        await sleep(1500); // Give user time to see what AI is dealing with

        let cost = Math.max(0, Math.max(Math.abs(s.p2.x - s.ball.x), Math.abs(s.p2.y - s.ball.y)) - s.ball.freeMv);
        let target = 'Center', power = 2;

        if (s.p2.score === 21) {
            target = 'Knob'; power = 1;
        } else if (cost > s.p2.stam) {
            target = 'Center'; power = 1; // Forced dive
        } else if (s.p2.stam <= 2 && mode === 'ai-safe') {
            document.getElementById('ai-status').innerText = "";
            catchBreath();
            return;
        } else if (s.ball.state === 'High') {
            if (mode === 'ai-aggro' || mode === 'ai-balanced') {
                power = 3; target = Math.random() > 0.5 ? 'Bottom' : 'Frame';
            } else { power = 2; target = 'Center'; }
        } else {
            if (mode === 'ai-aggro') {
                power = Math.random() > 0.4 ? 3 : 2; target = Math.random() > 0.4 ? 'Bottom' : 'Frame';
            } else if (mode === 'ai-balanced') {
                power = 2; target = Math.random() > 0.5 ? 'Center' : 'Bottom';
            } else { // safe
                power = 1; target = Math.random() > 0.5 ? 'Top' : 'Center';
            }
        }

        // Visually update dropdowns so player sees AI's choice
        document.getElementById('sel-target').value = target;
        document.getElementById('sel-power').value = power;
        document.getElementById('ai-status').innerText = `🤖 AI selects ${target} (Power ${power})`;
        
        await sleep(1000);
        document.getElementById('ai-status').innerText = "";
        playTurn();
    }

    // --- CORE TURN LOGIC ---
    async function playTurn() {
        if(s.isAnimating) return;
        s.isAnimating = true; setButtons(true);

        let p = s.active === 1 ? s.p1 : s.p2;
        let opp = s.active === 1 ? s.p2 : s.p1;
        let target = document.getElementById('sel-target').value;
        let power = parseInt(document.getElementById('sel-power').value);
        
        let dist = Math.max(Math.abs(p.x - s.ball.x), Math.abs(p.y - s.ball.y));
        let cost = Math.max(0, dist - s.ball.freeMv);
        
        if (cost > p.stam) {
            log(`<b>DIVE!</b> <span class="${p.class}">${p.id}</span> dives! Stamina = 0.`);
            p.stam = 0; power = 1; target = 'Center';
        } else { p.stam -= cost; }

        p.x = s.ball.x; p.y = s.ball.y;
        updateTokens(); renderUI();
        await sleep(600);

        let tn = { 'Top':3, 'Center':2, 'Bottom':4, 'Frame':5, 'Knob':6 }[target];
        let mod = 0;
        if(cost >= 3) mod -= 1; 
        if(p.x < 2 || p.x > 4) mod -= 1; 
        if(s.ball.state === 'Low' && target !== 'Bottom') mod -= 2; 
        if(s.ball.state === 'High' && power === 3) mod += 0; 
        else if(power === 3) mod -= 2;
        else if(power === 1) mod += 1;

        let roll = Math.floor(Math.random()*6)+1;
        let total = roll + mod;
        
        log(`<span class="${p.class}">${p.id}</span> aims at ${target}. Needs ${tn}.`);
        log(`Rolled ${roll} + (${mod} mod) = <b>${total}</b>.`);
        await sleep(500);

        if (total <= 0) {
            log(`<b>WHIFF!</b> Hit the wall. <span class="${opp.class}">${opp.id}</span> scores!`);
            handleScore(opp);
        } else if (total < tn) {
            log(`<b>FAIL.</b> Ball pops High!`);
            s.ball.state = 'High'; s.ball.freeMv = 3; scatterBall(8, 10); s.active = s.active === 1 ? 2 : 1;
        } else {
            if(target === 'Knob') {
                log(`<b>DING!</b> Knob hit! <span class="${p.class}">${p.id}</span> scores 3!`);
                handleScore(p, 3);
            } else if (target === 'Center' && p.x >=2 && p.x <=4 && roll === 6) {
                log(`<b>PIPELINE!</b> Accidental Knob Snipe! 3 points!`);
                handleScore(p, 3);
            } else {
                log(`<b>SOLID HIT.</b>`);
                if(target === 'Top') { s.ball.state = 'High'; scatterBall(8, 10); }
                if(target === 'Center') { s.ball.state = 'Mid'; scatterBall(5, 7); }
                if(target === 'Bottom') { s.ball.state = 'Low'; scatterBall(1, 3); }
                if(target === 'Frame') { s.ball.state = 'Mid'; scatterBall(2, 12); }
                
                s.ball.freeMv = power === 1 ? 3 : (power === 2 ? 1 : 0);
                s.active = s.active === 1 ? 2 : 1; 
            }
        }

        updateTokens(); renderUI();
        s.isAnimating = false;
        
        if (s.active === 1) setButtons(false);
        else triggerAI();
    }

    function scatterBall(minY, maxY) {
        s.ball.y = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
        s.ball.x = Math.max(0, Math.min(6, s.ball.x + Math.floor(Math.random() * 3) - 1));
    }

    function handleScore(winner, pts = 1) {
        if(winner.score === 21 && pts !== 3) {
            log(`Must hit Knob to win! Score remains 21.`);
        } else { winner.score = Math.min(21, winner.score + pts); }
        
        s.ball.x = 3; s.ball.y = 14; s.ball.state = 'Mid'; s.ball.freeMv = 3;
        s.p1.x = 3; s.p1.y = 14; s.p2.x = 4; s.p2.y = 14;
        s.active = winner === s.p1 ? 1 : 2; 
    }

    function catchBreath() {
        if(s.isAnimating) return;
        let p = s.active === 1 ? s.p1 : s.p2;
        p.stam = Math.min(10, p.stam + 3);
        log(`<span class="${p.class}">${p.id}</span> skips turn to catch breath!`);
        s.ball.state = 'High'; s.ball.freeMv = 3; 
        s.active = s.active === 1 ? 2 : 1;
        renderUI();
        
        if (s.active === 1) setButtons(false);
        else triggerAI();
    }

    buildGrid(); updateTokens(); renderUI();
</script>
</body>
</html>
