<script>
    async function playTurn() {
        // ... existing Scramble code ...
        
        let p = s.active === 1 ? s.p1 : s.p2;
        let isPeak = (p.stam === 10 && p.x >= 2 && p.x <= 4); // PEAK CONDITION CHECK
        
        // Modifiers
        let mod = (isPeak && s.target === 'KNOB' ? 1 : 0); // Peak Bonus
        mod += (power === 3 ? -2 : (power === 1 ? 1 : 0));
        if (p.stam <= 3) mod -= 1; // Softened Fatigue
        
        let roll = Math.floor(Math.random()*6)+1;
        let total = roll + mod;
        let tn = tn_map[s.target];

        if (total <= 0) {
            handleScore(opp, 1, "WHIFF"); // 45% Target
        } else if (s.target === 'KNOB' && (roll === 6 || total >= 6)) {
            handleScore(p, 3, "GLORY"); // 10% Target
        } else if (total >= tn) {
            // SUCCESSFUL HIT -> CALCULATE IF UNRETURNABLE
            let scatterX = (s.target.includes('L') ? 6 : (s.target.includes('R') ? 0 : 3));
            let scatterY = (s.target.includes('B') ? 1 : (s.target.includes('T') ? 12 : 6));
            
            // Check if opponent can reach
            let distToBall = Math.max(Math.abs(opp.x - scatterX), Math.abs(opp.y - scatterY));
            if (distToBall > opp.stam + 1) { // +1 for Power 2 free move
                handleScore(p, 1, "UNRETURNABLE"); // 45% Target
            } else {
                // Point continues...
            }
        }
    }
</script>
